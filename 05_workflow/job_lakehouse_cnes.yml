resources:
  jobs:
    job_lakehouse_cnes:
      name: job_lakehouse_cnes
      email_notifications:
        on_failure:
          - rafael.correa@al.infnet.edu.br
      trigger:
        pause_status: PAUSED
        periodic:
          interval: 30
          unit: DAYS
      tasks:
        - task_key: ingestao_bigquery
          notebook_task:
            notebook_path: /Workspace/Users/rafael.correa@al.infnet.edu.br/lakehouse_cnes/01_ingestao/ingestao_cnes_bigquery
            source: WORKSPACE
        - task_key: bronze
          depends_on:
            - task_key: ingestao_bigquery
          pipeline_task:
            pipeline_id: 2b674b56-c3ff-4059-ab29-bec87f868723
        - task_key: silver
          depends_on:
            - task_key: bronze
          pipeline_task:
            pipeline_id: 2b3e86ca-191c-4a9b-a8fa-5b5fa06ee254
        - task_key: silver_cdc
          depends_on:
            - task_key: silver
          pipeline_task:
            pipeline_id: 10c83724-1f67-448c-a8a1-276d22157ecf
        - task_key: gold
          depends_on:
            - task_key: silver_cdc
          pipeline_task:
            pipeline_id: 1c5a6100-19c2-40a1-bf4d-265580353eaf
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
